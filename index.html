<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Cards</title>
    <link rel="stylesheet" href="./public/css/index.css">
</head>
<body>
    <main>
        <section class="cards">
            
            <article class="card yellow-card">
                <header class="card-header">
                    <h2>Paula</h2>
                    <p>Pro member</p>
                </header>
                
                <img class="main-img" width="100" src="./public/image/4c55ebfe-a03f-4687-a564-90b29f38a5c2.jpeg" alt="Portrait of Paula">
                
                <div class="info">
                    <img class="avatar" width="100" src="./public/image/4c55ebfe-a03f-4687-a564-90b29f38a5c2.jpeg" alt="Paula's avatar">
                    <div class="data">
                        <p class="username">@pauliadams14</p>
                        <div class="tags">
                            <span class="tag pro">Pro</span>
                            <span class="tag">design</span>
                            <span class="tag">interior</span>
                        </div>
                    </div>
                    <button class="btn-connect">+ Connect</button>
                </div>
            </article>

            <article class="card pink-card">
                <header class="card-header">
                    <h2>Kumi</h2>
                    <p>Pro member</p>
                </header>
                
                <img class="main-img" width="100" src="./public/image/Gemini_Generated_Image_bdukifbdukifbduk.jpg" alt="Portrait of Kumi">
                
                <div class="info">
                    <img class="avatar" width="100" src="./public/image/Gemini_Generated_Image_bdukifbdukifbduk.jpg" alt="Kumi's avatar">
                    <div class="data">
                        <p class="username">@kumishi_yo</p>
                        <div class="tags">
                            <span class="tag pro">Pro</span>
                            <span class="tag">ai</span>
                            <span class="tag">robotics</span>
                        </div>
                    </div>
                    <button class="btn-connect">+ Connect</button>
                </div>
            </article>

            <article class="card orange-card">
                <header class="card-header">
                    <h2>Arthur</h2>
                    <p>Pro member</p>
                </header>
                
                <img class="main-img" width="100" src="./public/image/ChatGPT Image 31 août 2026, 13_43_37.png" alt="Portrait of Arthur">
                
                <div class="info">
                    <img class="avatar" width="100" src="./public/image/ChatGPT Image 31 août 2026, 13_43_37.png" alt="Arthur's avatar">
                    <div class="data">
                        <p class="username">@artiedenn</p>
                        <div class="tags">
                            <span class="tag pro">Pro</span>
                            <span class="tag">photo</span>
                            <span class="tag">video</span>
                        </div>
                    </div>
                    <button class="btn-connect">+ Connect</button>
                </div>
            </article>

        </section>
    </main>
</body>
</html>
